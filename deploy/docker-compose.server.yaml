name: lavender

services:
  lavender:
    image: cksidharthan/lavender:${VERSION:-v0.0.1}
    container_name: lavender
    restart: unless-stopped
    environment:
      HTTP_SERVER_PORT: "8080"
      ENVIRONMENT: production
      LOG_LEVEL: info
      OTEL_ENABLED: "false"
      POCKETBASE_DATA_DIR: /data/pb_data
      ICON_CACHE_DIR: /data/icons
    ports:
      - "8080:8080"
    volumes:
      - lavender-data:/data
    healthcheck:
      # the image is built from scratch, it ships a small health check binary
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  lavender-data:
