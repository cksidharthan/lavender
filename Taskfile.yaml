version: '3'

tasks:
  default:
    desc: list all the available commands
    cmds:
      - task --list-all

  fmt:
    desc: format the project files
    cmds:
      - go fmt ./...
      - go tool goimports -w .

  dev-setup:
    desc: installs all developer clis required to work with the project
    cmds:
      - brew install golang
      - brew install golangci-lint
      - brew install tailwindcss

  lint:
    desc: run linters on the project
    cmds:
      - golangci-lint run
      - templ fmt .

  deps:
    desc: pull all go dependencies
    cmds:
      - go mod download
      - go mod tidy
      - go mod verify

  css:
    desc: build the tailwind stylesheet (committed, as it is embedded into the binary)
    cmds:
      - tailwindcss -i pkg/ui/static/input.css -o pkg/ui/static/app.css --minify

  generate:
    desc: generate go code from the templ files and build the tailwind stylesheet
    cmds:
      - go tool templ generate
      - task: css

  run:
    desc: run the application
    cmds:
      - go tool templ generate --watch --cmd="go run ." --proxy="http://localhost:8080"

  test:
    desc: run the unit and integration tests
    cmds:
      - go test ./...
