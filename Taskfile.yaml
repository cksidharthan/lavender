version: '3'

tasks:
  default:
    desc: list all the available commands
    cmds:
      - task --list-all

  fmt:
    desc: format the project files
    cmds:
      - go fmt ./...
      - go tool goimports -w .

  dev-setup:
    desc: installs all developer clis required to work with the project
    cmds:
      - brew install golang
      - brew install golangci-lint

  lint:
    desc: run linters on the project
    cmds:
      - golangci-lint run
      - templ fmt .

  deps:
    desc: pull all go dependencies
    cmds:
      - go mod download
      - go mod tidy
      - go mod verify

  run:
    desc: run the application
    cmds:
      - go run main.go

  test:
    desc: run the unit and integration tests
    cmds:
      - go test ./...
